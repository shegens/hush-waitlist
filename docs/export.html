<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>hush — export</title>
  <style>
    body { background: #FDF6EE; font-family: system-ui; display: flex; flex-direction: column; align-items: center; padding: 2rem; gap: 1.5rem; }
    canvas { border: 1px solid #F9C49A; border-radius: 4px; max-width: 100%; }
    .btn { background: #D96B10; color: #fff; border: none; border-radius: 20px; padding: 0.6rem 1.4rem; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #F08030; }
    .label { font-size: 0.72rem; color: #8C5828; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>

<p class="label">og image — 1200 × 630</p>
<canvas id="og" width="1200" height="630"></canvas>
<a class="btn" id="dl-og" download="hush-og.png">download og.png</a>

<p class="label" style="margin-top:1rem">favicon — 512 × 512</p>
<canvas id="fav" width="512" height="512"></canvas>
<a class="btn" id="dl-fav" download="hush-favicon.png">download favicon.png</a>

<script>
  function drawOG(canvas) {
    const ctx = canvas.getContext('2d');
    const W = 1200, H = 630;

    // background
    ctx.fillStyle = '#FDF6EE';
    ctx.fillRect(0, 0, W, H);

    // glow
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 400);
    grad.addColorStop(0, 'rgba(249,196,154,0.18)');
    grad.addColorStop(1, 'rgba(253,246,238,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // wordmark only
    ctx.fillStyle = '#D96B10';
    ctx.font = 'italic 220px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = '8px';
    ctx.fillText('hush', W/2, H/2);
  }

  function drawFavicon(canvas) {
    const ctx = canvas.getContext('2d');
    const S = 512;

    // background with rounded corners
    ctx.fillStyle = '#FDF6EE';
    ctx.beginPath();
    ctx.roundRect(0, 0, S, S, S * 0.18);
    ctx.fill();

    // h
    ctx.fillStyle = '#D96B10';
    ctx.font = `italic ${S * 0.62}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('h', S/2, S/2 + S*0.04);
  }

  const ogCanvas = document.getElementById('og');
  const favCanvas = document.getElementById('fav');

  drawOG(ogCanvas);
  drawFavicon(favCanvas);

  document.getElementById('dl-og').href = ogCanvas.toDataURL('image/png');
  document.getElementById('dl-fav').href = favCanvas.toDataURL('image/png');

  // update download links after fonts load
  document.fonts.ready.then(() => {
    drawOG(ogCanvas);
    drawFavicon(favCanvas);
    document.getElementById('dl-og').href = ogCanvas.toDataURL('image/png');
    document.getElementById('dl-fav').href = favCanvas.toDataURL('image/png');
  });
</script>
</body>
</html>

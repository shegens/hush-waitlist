<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FDF6EE"/>

  <!-- subtle warm glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#F9C49A" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#FDF6EE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <text
    x="600"
    y="345"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="180"
    fill="#D96B10"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="6"
  >hush</text>

  <!-- tagline -->
  <text
    x="600"
    y="440"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="normal"
    font-size="28"
    fill="#8C5828"
    text-anchor="middle"
    letter-spacing="3"
  >All signal. No noise.</text>

  <!-- decibel bars decoration -->
  <g transform="translate(560, 500)">
    <rect x="0"  y="14" width="6" height="6"  rx="2" fill="#D96B10" opacity="0.35"/>
    <rect x="10" y="10" width="6" height="10" rx="2" fill="#D96B10" opacity="0.35"/>
    <rect x="20" y="5"  width="6" height="15" rx="2" fill="#D96B10" opacity="0.35"/>
    <rect x="30" y="0"  width="6" height="20" rx="2" fill="#D96B10" opacity="0.35"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hush</title>
  <link rel="icon" type="image/svg+xml" href="/hush-waitlist/favicon.svg">
  <meta property="og:title" content="hush">
  <meta property="og:description" content="All signal. No noise.">
  <meta property="og:image" content="https://shegens.github.io/hush-waitlist/og.svg">
  <meta property="og:url" content="https://shegens.github.io/hush-waitlist/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="hush">
  <meta name="twitter:description" content="All signal. No noise.">
  <meta name="twitter:image" content="https://shegens.github.io/hush-waitlist/og.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF6EE;
      --parchment:  #F7EDE2;
      --blush:      #F9C49A;
      --wine:       #D96B10;
      --wine-light: #F08030;
      --pink:       #F46080;
      --text:       #221206;
      --muted:      #8C5828;
      --handle:     #5C2E0E;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .wordmark {
      font-size: 2.5rem;
      font-style: italic;
      color: var(--wine);
      letter-spacing: 0.04em;
      margin-bottom: 1.25rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
      max-width: 320px;
      margin-bottom: 2.5rem;
    }

    .connect-btn {
      background: var(--wine);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 0.75rem 2rem;
      font-size: 0.85rem;
      font-family: system-ui;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 16px rgba(217,107,16,0.18);
    }

    .connect-btn:hover {
      background: var(--pink);
      transform: translateY(-1px);
    }

    /* confirmation state */
    .confirmation {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }

    .confirmation.show { display: flex; }

    .confirmation-icon {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      margin-bottom: 0.25rem;
    }

    .confirmation-icon .b {
      width: 4px;
      border-radius: 2px;
      background: var(--wine);
    }

    .confirmation-msg {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 280px;
      line-height: 1.6;
    }

    .confirmation-address {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--handle);
      background: var(--parchment);
      border-radius: 20px;
      padding: 0.3rem 0.85rem;
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.65rem;
      font-family: system-ui;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blush);
    }
  </style>
</head>
<body>

  <div id="cta">
    <div class="wordmark" style="text-align:center;">hush</div>
    <p class="tagline">All signal. No noise.</p>
    <button class="connect-btn" onclick="connectWallet()">join the waitlist</button>
  </div>

  <div class="confirmation" id="confirmation">
    <div class="confirmation-icon">
      <div class="b" style="height:6px"></div>
      <div class="b" style="height:10px"></div>
      <div class="b" style="height:15px"></div>
      <div class="b" style="height:20px"></div>
    </div>
    <div class="wordmark" style="font-size:1.5rem">hush</div>
    <p class="confirmation-msg">You're on the list. We'll be in touch when it's your turn to speak.</p>
    <span class="confirmation-address" id="wallet-address"></span>
  </div>

  <div class="footer">coming soon</div>

  <script>
    async function connectWallet() {
      // Para SDK will replace this stub
      // For now: simulate with MetaMask if available, else mock
      let address;
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          address = accounts[0];
        } catch(e) {
          return;
        }
      } else {
        // demo fallback
        address = '0x' + Array.from({length:40}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join('');
      }

      // TODO: POST address to waitlist API
      // await fetch('/api/waitlist', { method: 'POST', body: JSON.stringify({ address }) })

      document.getElementById('cta').style.display = 'none';
      document.getElementById('wallet-address').textContent = address.slice(0,6) + '…' + address.slice(-4);
      document.getElementById('confirmation').classList.add('show');
    }
  </script>
</body>
</html>
